[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "car-hmi"
version = "0.1.0"
description = "CAN-HMI — Real-time CAN bus signal reader, processor, and web dashboard for CarPC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HMI Team" }]

dependencies = [
    # CAN bus
    "python-can>=4.4",
    "cantools>=4.0",
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "httpx>=0.27",
    # Data validation
    "pydantic>=2.9",
    "pydantic-settings>=2.0",
    # Storage
    "aiosqlite>=0.20",
    # Processing
    "numpy>=1.26",
    # Config
    "pyyaml>=6.0",
    # System monitoring
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-html>=4.2.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "locust>=2.29",
]

[project.scripts]
can-hmi = "src.core.runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --tb=short"
markers = [
    "runtime: full process runtime smoke tests (opt-in)",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "src/*/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60
